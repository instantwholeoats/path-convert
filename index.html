<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
    <link rel="stylesheet" href="./css/pure-min.css">
    <script type="text/javascript" src="js/path-converter.js"></script>
    <script type="text/javascript" src="js/viewmain.js"></script>
    <title>PATHコンバータ</title>
  </head>
  <body>
    <form class="pure-form">
      <input class="pure-input-1" type="text" id="windowsPath" placeholder="\\server\path\to\file (Windows path)">
      <input class="pure-input-1" type="text" id="mountURI" placeholder="smb://server/path (Mac mount URI)">
      <input class="pure-input-1" type="text" id="macPath" placeholder="/Volumes/MountPoint/path/to/file (Mac path)">
      <input class="pure-input-1" type="text" id="userName" placeholder="UserName">
      <button class="pure-button" type="button" id="openButton">open</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </body>
</html>
